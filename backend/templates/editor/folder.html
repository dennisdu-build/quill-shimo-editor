{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>石墨文档</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232E7CF6'/%3E%3Cpath d='M5 7h14' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M12 7v11' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/folder.css' %}?v=7">
<script src="{% static 'js/common.js' %}"></script>

</head>
<body>
<div id="app">

  <!-- ==================== 顶栏 ==================== -->
  <header id="topbar">
    <div class="tb-logo">
      <svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#2E7CF6"/><path d="M5 7h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M12 7v11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="name">石墨文档</span>
    </div>
    <div id="tbSearch">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.4" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 9.4L12.6 12.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input placeholder="搜索当前位置" id="searchInput">
    </div>
    <div class="tb-right">
      <a class="tb-link" id="tplLink">模板库</a>
      <a class="tb-link" id="perkLink">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10l-1.2 4.2A2 2 0 0 1 8.9 9H5.1a2 2 0 0 1-1.9-1.3L2 3.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M5 9l-.8 2.5h5.6L9 9" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M3.2 11.5h7.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        更多权益
      </a>
      <div class="create-split" id="tbCreateWrap">
        <button class="cs-main" id="tbCreateMain">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v9M1.5 6h9" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
          创建
        </button>
        <button class="cs-arrow" id="tbCreateArrow">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.6 3L4.5 5.9L7.4 3" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="tbAvatar" title="我">D</div>
    </div>
  </header>

  <div id="bodyRow">

    <!-- ==================== 侧边栏 ==================== -->
    <aside id="sidebar">
      <div class="sb-create-wrap">
        <button id="sbCreate">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.8v10.4M1.8 7h10.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
          新建
        </button>
      </div>
      <nav id="sbNav">
        <div class="nav-item" id="navDesktop">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.8" y="2.8" width="12.4" height="8.4" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 13.8h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          我的桌面
        </div>
        <div class="nav-group-label">团队空间
          <span class="add" id="addSpaceBtn" title="新建团队空间">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.6v8.8M1.6 6h8.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
        </div>
        <div id="spaceList"></div>
        <div class="nav-item nav-add-space" id="addSpaceNav">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          新建团队空间
        </div>
        <div class="sb-divider"></div>
        <div class="nav-item" data-nav="recent">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          最近文件
        </div>
        <div class="nav-item" data-nav="shared">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.2" r="2.6" stroke="currentColor" stroke-width="1.3"/><path d="M2.8 13.4c.4-2.8 2.4-4.4 5.2-4.4s4.8 1.6 5.2 4.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          共享给我
        </div>
        <div class="nav-item" data-nav="fav">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6L8 1.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          我的收藏
        </div>
        <div class="nav-item disabled" data-nav="feed">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2a4 4 0 0 1 4 4v2.6l1.2 2.2H2.8L4 8.6V6a4 4 0 0 1 4-4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.4 13a1.7 1.7 0 0 0 3.2 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          工作动态
        </div>
        <div class="sb-divider"></div>
        <div class="nav-item" data-nav="tag">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 7.2V3a.5.5 0 0 1 .5-.5h4.2c.3 0 .5.1.7.3l5.6 5.6a1 1 0 0 1 0 1.4l-3.4 3.4a1 1 0 0 1-1.4 0L2.8 7.9a.5.5 0 0 1-.3-.7z" stroke="currentColor" stroke-width="1.3"/><circle cx="5.4" cy="5.4" r="1" fill="currentColor"/></svg>
          个人标签
        </div>
        <div class="nav-item disabled" data-nav="vipTag">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="6.5" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2" stroke="currentColor" stroke-width="1.3"/></svg>
          超级会员专享标签功能
          <span class="grow">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="5" width="9" height="5.5" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 5V3.8a2.5 2.5 0 0 1 5 0V5" stroke="currentColor" stroke-width="1.2"/></svg>
          </span>
        </div>
        <div class="sb-divider"></div>
        <div id="quickBox">
          <div class="nav-item" data-nav="quick">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M9 1.8L3.4 9h3.4l-.8 5.2L11.8 7H8.4L9 1.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            快速访问
          </div>
          <ul class="quick-list" id="quickList"></ul>
          <div id="quickDrop">松开鼠标添加</div>
        </div>
        <div class="sb-divider"></div>
        <div class="nav-item" data-nav="trash">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.8 4h10.4M5.8 4V2.8a.8.8 0 0 1 .8-.8h2.8a.8.8 0 0 1 .8.8V4M4.2 4l.6 8.6a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9L11.8 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 7v3.6M9.4 7v3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          回收站
        </div>
      </nav>
      <div class="sb-bottom">
        <div id="upgradeBox">
          <div class="t">升级到高级版</div>
          <div class="d">尊享更多高级权益</div>
        </div>
        <div id="capacity">
          <div class="cap-label"><span>我的容量</span><span id="capText">0 B/1 GB</span></div>
          <div id="capBar"><i id="capFill"></i></div>
        </div>
      </div>
    </aside>

    <!-- 折叠把手 -->
    <div id="gutter" title="收起侧边栏">
      <div id="gutterBtn">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M6.5 1.5L3 5l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- ==================== 主内容区 ==================== -->
    <main id="main">
      <div id="crumbHeader">
        <div id="crumbs"></div>
        <div id="crumbOps">
          <button id="newHereBtn">
            新建到此处
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5l3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="op-divider"></div>
          <button class="op-btn" id="filterBtn" title="筛选">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 3.5h11L9.3 8.4v4.1l-2.6-1.4V8.4L2.5 3.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
          <button class="op-btn" id="viewBtn" title="视图切换">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2.2" width="4.8" height="4.8" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2.2" y="9" width="4.8" height="4.8" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="4.8" height="4.8" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <button class="op-btn" id="moreOpBtn" title="更多">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="3.2" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="12.8" cy="8" r="1.1" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div id="contentRow">
        <div id="listArea">
          <div id="listWrapper">
            <!-- 表头 -->
            <div class="tr" id="tableHeader">
              <div class="fr-ck"><span class="ck" id="ckAll" title="全选">
                <svg class="check" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5.2L4 7.7l4.5-5.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="minus" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span></div>
              <div class="th th-name th-sort" data-sort="title">文件名<span class="arr">↑</span></div>
              <div class="th">创建者</div>
              <div class="th th-sort" data-sort="updated_at">最近更新<span class="arr">↑</span></div>
              <div class="th th-sort" data-sort="size">大小<span class="arr">↑</span></div>
              <div class="th th-pub"></div>
            </div>
            <!-- 批量操作条 -->
            <div id="batchBar">
              <span id="batchCount">已选 0 项</span>
              <span class="ops">
                <button class="bb-btn bb-del" id="batchDel">删除</button>
                <button class="bb-btn" id="batchCancel">取消</button>
              </span>
            </div>
            <!-- 文件行容器 -->
            <div id="fileList"></div>
            <!-- 空状态 -->
            <div id="emptyState">
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><path d="M14 8h26l12 12v34a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" stroke="rgba(65,70,75,.25)" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 8v12h12" stroke="rgba(65,70,75,.25)" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 32h20M22 40h20M22 48h12" stroke="rgba(65,70,75,.2)" stroke-width="2.5" stroke-linecap="round"/></svg>
              <div class="t">此处空空如也，新建一个吧</div>
              <button id="emptyCreate">新建文档</button>
            </div>
          </div>
        </div>

        <!-- ==================== 右侧详情面板 ==================== -->
        <aside id="detailPanel">
          <div id="dpPlaceholder">请选择一个文件或者文件夹预览</div>
          <div id="dpContent">
            <div class="dp-preview" id="dpPreview"></div>
            <div class="dp-title" id="dpTitle"></div>
            <div class="dp-meta" id="dpMeta"></div>
            <div class="dp-actions" id="dpActions">
              <button class="dp-open" id="dpOpen">打开</button>
              <button class="dp-rename" id="dpRename">重命名</button>
              <button class="dp-del" id="dpDel">删除</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>

<!-- 新建团队空间弹窗 -->
<div class="modal-mask" id="spaceModal">
  <div class="modal-box">
    <div class="m-head">新建团队空间</div>
    <div class="m-body">
      <div class="m-label">空间名称</div>
      <input class="m-input" id="spaceNameInput" maxlength="100" placeholder="请输入空间名称">
      <div class="m-error" id="spaceError"></div>
    </div>
    <div class="m-foot">
      <button class="m-btn cancel" id="spaceCancel">取消</button>
      <button class="m-btn ok" id="spaceOk" disabled>创建</button>
    </div>
  </div>
</div>

<script src="{% static 'js/api.js' %}?v=5"></script>
<script id="bootData" type="application/json">{"space": {{ space_id|default:1 }}, "folder": {{ folder_id|default:'null' }}}</script>
<script src="{% static 'js/folder.js' %}?v=6"></script>
</body>
</html>
